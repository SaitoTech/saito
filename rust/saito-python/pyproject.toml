[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "saito-python"
version = "0.1.0"
description = "Python SDK scaffolding for Saito clients and nodes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/saito_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

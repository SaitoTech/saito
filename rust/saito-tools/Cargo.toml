[package]
name = "saito-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37.0", features = ["full"] }
{# add saito-core as a dependency #}
saito-core = { path = "../saito-core" }
secp256k1 = { version = "0.30.0", features = ["rand", "hashes", "global-context", "serde"] }
rand = { version = "0.8.5", features = ["getrandom"] }
pretty_env_logger = "0.5.0"
byteorder = "1.5.0"
blake3 = { version = "1.5.0", features = ["rayon"] }
aes = "0.7.5"
block-modes = "0.8.1"
merkle = "1.11.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_with = "3.8.1"
hex = "0.4.3"
ahash = "0.8.11"
num-derive = "0.4.2"
num-traits = "0.2.19"
rayon = "1.10.0"
async-trait = "0.1.80"
primitive-types = "0.12.2"
futures = { version = "0.3.29" }
log = "0.4.20"
bs58 = "0.5.0"
base64 = "0.21.5"
chrono = "0.4.35"
reqwest = { version = "0.12.20", features = ["json"] }
serde_json = "1.0.140"

[lib]
path = "src/empty.rs"

[[bin]]
name = "blockreader"
path = "src/bin/blockreader.rs"



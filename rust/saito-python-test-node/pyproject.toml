[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "saito-python-test-node"
version = "0.1.0"
description = "Integration harness for running a Python-driven Saito node against a Rust node"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "saito-python>=0.1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/saito_python_test_node"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
